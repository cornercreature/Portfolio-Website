<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="mainstyle.css">
    <link rel="icon" type="image/png" href="assets/fav.png">
    <title>Nicole Sun - Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:ital,wght@0,400..800;1,400..800&display=swap"
        rel="stylesheet">
</head>

<body>
    <section id="about" class="about-section">
        <div class="about-bio">
            <p class="bio-paragraph">
                Nicole is a designer-student of systems and worlds. She is currently
                pursuing her BFA in Graphic Design and Computation at the Rhode Island School of Design.
            </p>
        </div>

        <div class="about-links">
            <a href="mailto:nsun01@risd.edu">Email</a>
            <a href="https://www.linkedin.com/in/nicole-sun-437a93289" target="_blank" rel="noopener noreferrer">LinkedIn</a>
            <a href="https://www.instagram.com/nnnicole.jwww/" target="_blank" rel="noopener noreferrer">Instagram</a>
            <a href="https://drive.google.com/file/d/1AkInE_S9DCLfQdgHjMiP4ph6aOBcHyeq/view?usp=sharing" target="_blank" rel="noopener noreferrer">Resume</a>       
        </div>
    </section>

    <main class="portfolio-main">
        <div class="portfolio-column portfolio-column-left" id="left">

        </div>
        <div class="portfolio-detail" id="center">
            <div class="detail-description">
                <div class="unitL left-info">
                <div class="description-unit">
                    <p class="detail-title"></p>
                    <p class="detail-category"></p>
                </div>
                <div class="description-unit">
                    <p class="collaborators"></p>
                    <p class="year"></p>
                    <p class="for"></p>
                    <p class="deliverables"></p>
                </div>
                </div>
                <div class="unitL right-info">
                <div class="description-unit">
                    <p class="detail-text"></p>
                </div>
                </div>
            </div>
            <div class="detail-images">
                <img class="detail-main-image" src="" alt="">
            </div>
            <!-- <button id="closeDetail">Close</button> -->
        </div>
        <div class="portfolio-column portfolio-column-right" id="right">

        </div>
    </main>
    <script type="module" src="js/main.js"></script>
</body>

</html>
